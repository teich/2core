start_zone:
  name: Start a timed zone run
  description: Run one zone for 1–60 minutes. Rejects overlaps and active rain delays.
  fields:
    config_entry_id:
      name: 2core integration
      required: true
      selector:
        config_entry:
          integration: tucor_2core
    zone:
      name: Zone number
      required: true
      selector:
        number:
          min: 1
          max: 100
          mode: box
    minutes:
      name: Minutes
      default: 1
      required: true
      selector:
        number:
          min: 1
          max: 60
          mode: box
stop_zone:
  name: Stop a zone started by 2core
  fields:
    config_entry_id:
      name: 2core integration
      required: true
      selector:
        config_entry:
          integration: tucor_2core
    zone:
      name: Zone number
      required: true
      selector:
        number:
          min: 1
          max: 100
          mode: box
stop_my_watering:
  name: Stop watering started by 2core
  description: Stops only recorded 2core runs; leaves scheduled or externally started runs alone.
  fields:
    config_entry_id:
      name: 2core integration
      required: true
      selector:
        config_entry:
          integration: tucor_2core
set_rain_delay:
  name: Set rain delay
  description: Replace the controller rain delay. Zero explicitly clears it.
  fields:
    config_entry_id:
      name: 2core integration
      required: true
      selector:
        config_entry:
          integration: tucor_2core
    hours:
      name: Hours
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box
