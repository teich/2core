services:
  two-core-demo:
    build: .
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      MODE: demo
    volumes:
      - demo-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  demo-data:
