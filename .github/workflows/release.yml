name: Release Home Assistant integration

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' custom_components/tucor_2core/manifest.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run bridge tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run Home Assistant tests
        run: python -m pytest -q

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
